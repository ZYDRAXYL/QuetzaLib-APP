name: quetzalib
description: "QuetzaLib - scan a book's ISBN, look up its details, and manage your personal library."
publish_to: 'none'

version: 1.13.0+19

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local persistence -- sqflite_common_ffi_web backs the same sqflite API
  # with an on-device sqlite file stored in the browser's IndexedDB, so the
  # web build gets its own local database file too (see database_service.dart).
  sqflite: ^2.4.1
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # Barcode / ISBN scanning
  mobile_scanner: ^6.0.6
  permission_handler: ^11.3.1

  # Cover/spine/page photo capture
  image_picker: ^1.1.2

  # Document scanning (cover/spine/back photos) + on-device OCR (scan-to-fill
  # for title/author/illustrator/ISBN/publisher fields)
  google_mlkit_document_scanner: ^0.5.0
  google_mlkit_text_recognition: ^0.16.0

  # Networking + metadata parsing
  http: ^1.2.2

  # App update (in-place APK install over an existing install)
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0

  # Database backup/restore: bundles the library + its local cover/page
  # photos into a single .zip file the user can export/import.
  archive: ^3.6.1
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/fonts/NotoSansThai-OFL.txt
  # web/desktop (Electron): Flutter web otherwise downloads its Thai fallback
  # font from fonts.gstatic.com, so Thai text vanishes offline. Used only when
  # kIsWeb (see buildAppTheme).
  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai.ttf

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/QuetzaLib_Icon.png"
